# api.delicatecourier.co.za — the Delicate Integration service.
#
# Separate file from delicate.conf on purpose. That file serves api2, which is
# live production taking real merchant webhooks; this host must never be a
# reason to edit it.

upstream delicate_integration { server 127.0.0.1:8096; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name api.delicatecourier.co.za;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.delicatecourier.co.za;

    # Straight at the certbot live path, not a copy. The copy under
    # /etc/nginx/ssl/delicate is why api2's certificate does not renew itself.
    ssl_certificate     /etc/letsencrypt/live/api.delicatecourier.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.delicatecourier.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    # The merchant admin API is NOT served here. Its only caller is the portal,
    # which runs on this same host and reaches it over 127.0.0.1:8096. Putting it
    # on the public internet would expose every merchant's configuration behind
    # one static admin key, for no gain. 404, not 403: a refusal that confirms
    # the path exists is still an answer.
    location /api/admin/ { return 404; }

    # What the WooCommerce plugin actually calls: order push, waybill, health,
    # and the public checkout rates.
    location /api/ {
        proxy_pass http://delicate_integration;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}
