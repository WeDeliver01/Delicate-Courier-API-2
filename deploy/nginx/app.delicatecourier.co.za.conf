# app.delicatecourier.co.za — the Delicate Couriers portal (Next.js).
#
# Its own file, like api.delicatecourier.co.za. delicate.conf serves production
# and is not edited to add hosts to it.

upstream delicate_portal_web { server 127.0.0.1:5000; keepalive 32; }
upstream delicate_portal_api { server 127.0.0.1:8080; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name app.delicatecourier.co.za;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.delicatecourier.co.za;

    ssl_certificate     /etc/letsencrypt/live/app.delicatecourier.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.delicatecourier.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    # Deliberately NOT mirrored from app2: /hangfire. It is a job dashboard, and
    # a second public door to it buys nothing — it is still reachable on app2 for
    # whoever actually needs it.

    location /api/ {
        proxy_pass http://delicate_portal_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://delicate_portal_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
