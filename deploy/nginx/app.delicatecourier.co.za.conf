# app.delicatecourier.co.za — the Delicate Engine's portal.
#
# The Engine, not the .NET platform. This host pointed at 127.0.0.1:5000 for a
# few hours, which is delicate-web — the live production portal behind app2,
# with production merchants and shipments in it. That was wrong: this name
# exists for the new stack, which has its own database, its own Supabase
# project and its own data. Anyone who signed in here in that window was
# looking at production.
#
# Same upstreams as the apex, which serves marketing, portal and admin from one
# Next.js app. The split is by hostname rather than by app: the apex is where
# people arrive, this is where they work.

upstream delicate_engine_web { server 127.0.0.1:8094; keepalive 32; }
upstream delicate_engine_api { server 127.0.0.1:8095; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name app.delicatecourier.co.za;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.delicatecourier.co.za;

    ssl_certificate     /etc/letsencrypt/live/app.delicatecourier.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.delicatecourier.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Unique per host, or nginx refuses to start on a duplicate zone name.
    ssl_session_cache   shared:SSL_app_delicatecourier:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Proof-of-delivery photos arrive as data URLs inside JSON.
    client_max_body_size 4m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Straight through, so a webhook signature is computed over the bytes the
    # provider actually sent — anything that re-encodes the body breaks it.
    location /api/ {
        proxy_pass http://delicate_engine_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://delicate_engine_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
