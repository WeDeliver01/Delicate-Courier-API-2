upstream delicate_api { server 127.0.0.1:8080; keepalive 32; }
upstream delicate_web { server 127.0.0.1:5000; keepalive 32; }

server {
    listen 80;
    listen [::]:80;
    server_name api2.delicatecourier.co.za app2.delicatecourier.co.za webhooks2.delicatecourier.co.za;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api2.delicatecourier.co.za app2.delicatecourier.co.za webhooks2.delicatecourier.co.za;

    ssl_certificate     /etc/letsencrypt/live/api2.delicatecourier.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api2.delicatecourier.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://delicate_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /hangfire {
        proxy_pass http://delicate_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://delicate_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
